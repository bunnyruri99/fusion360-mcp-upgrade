[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion360-mcp"
version = "0.1.0"
description = "Fusion 360 API over MCP protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
fusion360-mcp = "fusion360_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion360_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
